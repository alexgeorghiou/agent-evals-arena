name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,dashboard]"
      - run: pytest --cov=evals_arena --cov-report=term-missing

  eval-gate:
    # Runs the example suites offline and fails the PR if scores regress
    # against baselines/baseline.json.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: arena validate suites
      - name: Gate fake-strong against its baseline
        run: arena gate suites --model fake:fake-strong --baseline baselines/baseline.json --json-out gate.json
      - name: Self-check - a weaker candidate must be rejected
        # Guards the gate itself: if this ever passes, the gate has stopped detecting regressions.
        run: |
          if arena gate suites --model fake:fake-fast --baseline-model fake-strong \
               --baseline baselines/baseline.json --summary-file /dev/null; then
            echo "::error::gate accepted a regressed candidate"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            .arena/
            gate.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agent-evals-arena:ci
