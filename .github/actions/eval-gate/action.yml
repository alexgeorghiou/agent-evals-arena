name: agent-evals-arena gate
description: Run agent eval suites and fail the job when scores regress against a baseline.

inputs:
  suites:
    description: Suite files or directories (space separated).
    default: suites
  model:
    description: Provider spec, e.g. anthropic:claude-opus-5-5 or fake:fake-strong.
    required: true
  baseline:
    description: Path to the committed baseline JSON.
    default: baselines/baseline.json
  judge:
    description: "'heuristic' or a provider spec used as LLM judge."
    default: heuristic
  max-score-drop:
    description: Allowed absolute drop in mean suite score.
    default: "0.02"
  extra-args:
    description: Additional arguments for `arena gate`.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "agent-evals-arena[anthropic,openai] @ ${{ github.action_path }}/../../.."
    - shell: bash
      run: >
        arena gate ${{ inputs.suites }}
        --model "${{ inputs.model }}"
        --baseline "${{ inputs.baseline }}"
        --judge "${{ inputs.judge }}"
        --max-score-drop "${{ inputs.max-score-drop }}"
        ${{ inputs.extra-args }}
